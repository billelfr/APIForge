name: Deploy APIForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apiforge-deployment
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build applications
        run: npm run build

      - name: Validate deployment Compose file
        env:
          BACKEND_IMAGE: example.invalid/apiforge-backend:validation
          FRONTEND_IMAGE: example.invalid/apiforge-frontend:validation
          POSTGRES_PASSWORD: validation-only
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy on EC2 through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          FRONTEND_IMAGE: ${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          for required in AWS_REGION EC2_INSTANCE_ID BACKEND_IMAGE FRONTEND_IMAGE; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required GitHub Actions variable for ${required}" >&2
              exit 1
            fi
          done

          compose_b64="$(base64 -w 0 docker-compose.deploy.yml)"
          parameters="$(jq -cn \
            --arg compose "$compose_b64" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                "set -eu",
                "install -d -m 0750 /opt/apiforge",
                ("printf %s " + ($compose | @sh) + " | base64 -d > /opt/apiforge/docker-compose.yml"),
                "if [ ! -s /opt/apiforge/.env ]; then printf 'POSTGRES_DB=apiforge\\nPOSTGRES_USER=apiforge\\nPOSTGRES_PASSWORD=%s\\n' \"$(openssl rand -hex 32)\" > /opt/apiforge/.env; chmod 600 /opt/apiforge/.env; fi",
                "chmod 600 /opt/apiforge/.env",
                ("export AWS_REGION=" + ($region | @sh) + "; export BACKEND_IMAGE=" + ($backend | @sh) + "; export FRONTEND_IMAGE=" + ($frontend | @sh) + "; registry=\"${BACKEND_IMAGE%%/*}\"; aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$registry\"; if docker compose --env-file /opt/apiforge/.env -f /opt/apiforge/docker-compose.yml pull; then docker logout \"$registry\"; else docker logout \"$registry\" || true; exit 1; fi"),
                ("export BACKEND_IMAGE=" + ($backend | @sh) + "; export FRONTEND_IMAGE=" + ($frontend | @sh) + "; docker compose --env-file /opt/apiforge/.env -f /opt/apiforge/docker-compose.yml up -d --remove-orphans"),
                "for attempt in $(seq 1 36); do if curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi; sleep 5; done; docker compose --env-file /opt/apiforge/.env -f /opt/apiforge/docker-compose.yml logs --tail=100; exit 1"
              ]
            }')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy APIForge ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for SSM command ${command_id}" >&2
          exit 1
